<nav class="tab-bar">
  @for (tab of tabs; track tab.path) {
    <a
      class="tab-bar__item"
      [routerLink]="tab.path"
      routerLinkActive="tab-bar__item--active"
      [routerLinkActiveOptions]="{ exact: tab.exact }"
    >
      <mat-icon class="tab-bar__icon">{{ tab.icon }}</mat-icon>
      <span class="tab-bar__label">{{ tab.label }}</span>
    </a>
  }
</nav>
